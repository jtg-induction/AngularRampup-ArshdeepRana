<div class="article-card" (click)="goToDetails()">
    <div class="article-card__author">{{ author }}</div>
    <h2 class="article-card__title">{{ title }}</h2>
    <p class="article-card__description">{{ description }}</p>
    <div class="article-card__tags">
        <span *ngFor="let tag of tags | slice:0:3; let i = index" [style.backgroundColor]="tagColors[i]"
            class="article-card__tags-item">
            {{ tag }}
        </span>
    </div>
</div>
