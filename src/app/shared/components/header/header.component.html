<header class="app-header">
  <nav class="app-header__navbar">
    <a class="app-header__logo" href="http://localhost:4200/dashboard">Vibe Reads</a>

    <ul class="app-header__nav-links">
      <li class="app-header__nav-item">
        <button class="icon-btn" (click)="addArticle()">
          <mat-icon title="Add a new Article">add</mat-icon>
        </button>
      </li>
      <li class="app-header__nav-item">
        <button class="icon-btn" (click)="openSearchDialog()">
          <mat-icon title="Search by article name">search</mat-icon>
        </button>
      </li>
      <li class="app-header__nav-item">
        <button class="icon-btn" (click)="openFilterDialog()">
          <mat-icon title="Apply filters">filter_list</mat-icon>
        </button>
      </li>
      <li class="app-header__nav-item">
        <button class="button button--danger" (click)="logout()">Logout</button>
      </li>
    </ul>
  </nav>
</header>
